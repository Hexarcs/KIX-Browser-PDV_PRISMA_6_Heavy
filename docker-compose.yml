services:
  web:
    build: .
    container_name: browser-pos
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - ./data:/app/data
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    restart: unless-stopped
